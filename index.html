<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculate the fuel cost of a journey using distance, fuel price and recorded MPG.">
    <title>Journey Fuel Cost Calculator</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <main class="app">
        <section class="card">
            <div class="top-bar">
                <span></span>
                <button type="button" id="themeToggle" class="theme-toggle" aria-label="Switch to dark mode">
                    <span id="themeIcon">☾</span>
                    <span id="themeText">Dark mode</span>
                </button>
            </div>

            <header class="header">
                <p class="eyebrow">Journey calculator</p>
                <h1>Journey Fuel Cost</h1>
                <p class="intro">Calculate what your journey actually cost using the MPG recorded by your car.</p>
            </header>

            <form id="calculatorForm" novalidate>
                <div class="form-group">
                    <label for="distance">Journey distance</label>
                    <div class="input-with-unit">
                        <input id="distance" name="distance" type="number" inputmode="decimal"
                               min="0.01" step="0.1" placeholder="120" autocomplete="off" required>
                        <span>miles</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="fuelPrice">Fuel price</label>
                    <div class="input-with-unit">
                        <span>£</span>
                        <input id="fuelPrice" name="fuelPrice" type="number" inputmode="decimal"
                               min="0.001" step="0.001" placeholder="1.459" autocomplete="off" required>
                        <span>/ litre</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="mpg">Recorded MPG</label>
                    <div class="input-with-unit">
                        <input id="mpg" name="mpg" type="number" inputmode="decimal"
                               min="0.1" step="0.1" placeholder="42" autocomplete="off" required>
                        <span>MPG</span>
                    </div>
                    <p class="help-text">Uses UK / Imperial MPG.</p>
                </div>

                <button type="submit" class="calculate-button">Calculate cost</button>
                <p id="errorMessage" class="error-message" role="alert" aria-live="polite"></p>
            </form>

            <section id="results" class="results" aria-live="polite" hidden>
                <div class="results-heading">
                    <span>Journey cost</span>
                    <strong id="journeyCost">£0.00</strong>
                </div>

                <div class="result-grid">
                    <div class="result-item">
                        <span>Fuel used</span>
                        <strong id="fuelUsed">0.00 L</strong>
                    </div>
                    <div class="result-item">
                        <span>Cost per mile</span>
                        <strong id="costPerMile">£0.000</strong>
                    </div>
                </div>
            </section>

            <button type="button" id="clearButton" class="clear-button">Clear</button>
        </section>

        <footer>
            <p>Fuel cost is calculated using UK / Imperial MPG.</p>
            <p>© 2026 Russell Myers</p>
        </footer>
    </main>

    <script src="Scripts/app.js"></script>
</body>
</html>
